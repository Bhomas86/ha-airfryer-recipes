name: Offline unit tests

on:
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run the full Python matrix at a section boundary"
        type: boolean
        default: false

concurrency:
  group: offline-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.full_suite == true && '["3.12", "3.14"]' || '["3.12"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q custom_components tests
      - name: Unit tests (offline; no device access)
        run: python -m unittest discover -s tests -v
      - name: Recipe panel tests (offline)
        if: matrix.python-version == '3.12'
        run: node --test tests/test_panel.mjs
