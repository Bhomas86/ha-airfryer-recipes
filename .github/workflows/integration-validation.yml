name: Home Assistant and HACS validation

on:
  pull_request:
    paths:
      - "custom_components/**/manifest.json"
      - "custom_components/**/strings.json"
      - "custom_components/**/translations/**"
      - "custom_components/**/services.yaml"
      - "hacs.json"
      - ".github/workflows/integration-validation.yml"
  workflow_dispatch:

concurrency:
  group: integration-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS integration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
